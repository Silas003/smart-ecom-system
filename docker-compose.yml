version: '3.8'
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: smartEcom
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Drake@7890
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  mongo:
    image: mongo:6
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

volumes:
  postgres-data:
  mongo-data:
